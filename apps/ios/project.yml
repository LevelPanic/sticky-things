name: StickyThings
options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: app.stickythings
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  StickyThings:
    path: ../..
targets:
  StickyThings:
    type: application
    platform: iOS
    sources:
      - path: Sources/StickyThingsIOS
      - path: Sources/Shared
      - path: Resources/Assets.xcassets
    dependencies:
      - package: StickyThings
        product: StickyCore
      - package: StickyThings
        product: StickyIOSDesign
      - target: StickyThingsWidgets
        embed: true
      - target: StickyThingsHomeWidget
        embed: true
      - target: StickyThingsShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stickythings.StickyThings
        PRODUCT_NAME: Sticky Things
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Resources/StickyThings.entitlements
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES
  StickyThingsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/StickyThingsWidgets
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stickythings.StickyThings.Widgets
        PRODUCT_NAME: StickyThingsWidgets
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Widgets-Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Resources/Widgets.entitlements
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
  StickyThingsShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/StickyThingsShare
    dependencies:
      - package: StickyThings
        product: StickyCore
      - package: StickyThings
        product: StickyIOSDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stickythings.StickyThings.Share
        PRODUCT_NAME: StickyThingsShare
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Share-Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Resources/Share.entitlements
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
  StickyThingsHomeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/StickyThingsWidget
      - path: Sources/Shared
    dependencies:
      - package: StickyThings
        product: StickyCore
      - package: StickyThings
        product: StickyIOSDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stickythings.StickyThings.HomeWidget
        PRODUCT_NAME: StickyThingsHomeWidget
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/StickyWidget-Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Resources/Widgets.entitlements
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
schemes:
  StickyThings:
    build:
      targets:
        StickyThings: all
        StickyThingsWidgets: all
        StickyThingsHomeWidget: all
        StickyThingsShare: all
    run:
      config: Debug
    archive:
      config: Release
